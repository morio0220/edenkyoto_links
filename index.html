<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イベントバーエデン京都 リンク集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8EBF0; --ink:#14202E; --sub:#4A5666; --line:#B9C0CB; --accent:#7A5C12;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111B28;--ink:#EDE8DC;--sub:#9AA5B5;--line:#2C3A4D;--accent:#D2AE5E}
}
:root[data-theme="dark"]{--bg:#111B28;--ink:#EDE8DC;--sub:#9AA5B5;--line:#2C3A4D;--accent:#D2AE5E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.8}
main{max-width:30rem;margin:0 auto;padding:4.5rem 1.5rem 4rem}
h1{font-size:1.9rem;font-weight:700;letter-spacing:.12em;line-height:1.4;margin:0}
.place{margin:.6rem 0 3rem;color:var(--sub);font-size:.95rem;letter-spacing:.1em}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a{display:block;padding:1.1rem .1rem;color:inherit;text-decoration:none}
a .name{display:block;font-size:1.15rem;font-weight:500;letter-spacing:.06em}
a .note{display:block;font-size:.85rem;color:var(--sub)}
a:hover .name,a:focus-visible .name{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>イベントバー<br>エデン京都</h1>
  <p class="place">京都・祇園</p>
  <ul>
    <li><a href="https://share.google/PH3WKQ4jV1wIM1NTx" target="_blank" rel="noopener"><span class="name">お店の情報</span><span class="note">場所・口コミ</span></a></li>
    <li><a href="https://calendar.google.com/calendar/embed?src=749335330c9086df78a7b71da0baa4ae4dd4e7968ee0b6b307e91743946be5d1%40group.calendar.google.com&amp;ctz=Asia%2FTokyo" target="_blank" rel="noopener"><span class="name">イベントカレンダー</span><span class="note">開催日をカレンダーで見る</span></a></li>
    <li><a href="https://docs.google.com/document/d/1iJaRuo0zo3QP0qs68ErYgJFre5kST_Mm6OnAquFBldU/edit?usp=sharing" target="_blank" rel="noopener"><span class="name">案内資料</span><span class="note">一日店長・イベント開催をご検討の方へ</span></a></li>
    <li><a href="https://x.com/EBE_Kyoto?s=20" target="_blank" rel="noopener"><span class="name">X</span><span class="note">@EBE_Kyoto</span></a></li>
    <li><a href="https://www.instagram.com/edenkyoto/" target="_blank" rel="noopener"><span class="name">Instagram</span><span class="note">@edenkyoto</span></a></li>
  </ul>
</main>
</body>
</html>
